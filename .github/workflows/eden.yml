name: EDEN CI
on:
  push:
    paths: ['EDEN/**', '.github/workflows/eden.yml']
  pull_request:
    paths: ['EDEN/**', '.github/workflows/eden.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GKSwstype: '100'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - run: julia --project=EDEN -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
