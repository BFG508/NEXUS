name: BEAM CI
on:
  push:
    paths: ['BEAM/**', '.github/workflows/beam.yml']
  pull_request:
    paths: ['BEAM/**', '.github/workflows/beam.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - working-directory: BEAM
        run: pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: BEAM
        run: pytest -q
