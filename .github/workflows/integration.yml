name: NEXUS Integration CI
on:
  push:
    paths:
      - 'integration/**'
      - 'scripts/check_hermes_atlas.py'
      - 'AEGIS/**'
      - 'ASTRA/**'
      - 'ATLAS/**'
      - 'BEAM/**'
      - 'EDEN/**'
      - 'ETHOS/**'
      - 'GAIA/**'
      - 'HERMES/**'
      - 'LEVI/**'
      - 'SCALE/**'
      - 'SPARTAN/**'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'integration/**'
      - 'scripts/check_hermes_atlas.py'
      - 'AEGIS/**'
      - 'ASTRA/**'
      - 'ATLAS/**'
      - 'BEAM/**'
      - 'EDEN/**'
      - 'ETHOS/**'
      - 'GAIA/**'
      - 'HERMES/**'
      - 'LEVI/**'
      - 'SCALE/**'
      - 'SPARTAN/**'
      - '.github/workflows/integration.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pytest
      - run: python -m pytest -q integration/tests
      - name: HERMES NEXUS smoke scenario
        run: |
          go -C HERMES run ./cmd/hermes run --runs-dir "${RUNNER_TEMP}/hermes-runs" --run-id integration-ci ../integration/scenarios/hermes_v0.1_smoke.yaml
          go -C HERMES run ./cmd/hermes inspect "${RUNNER_TEMP}/hermes-runs/integration-ci"
      - run: python scripts/repo_preflight.py
      - name: Build current standalone release assets
        run: |
          for project in AEGIS ASTRA ATLAS BEAM EDEN ETHOS GAIA HERMES LEVI SCALE SPARTAN; do
            python scripts/build_release_assets.py "$project"
          done
      - run: python scripts/check_release_isolation.py

  atlas-hermes:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build HERMES and ATLAS on Linux
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go -C HERMES build -o "${RUNNER_TEMP}/hermes" ./cmd/hermes
          swift build --package-path ATLAS
      - name: Verify successful runs, preparation failures and malformed manifests
        run: python scripts/check_hermes_atlas.py --hermes "${RUNNER_TEMP}/hermes" --atlas ATLAS/.build/debug/atlas
