name: SCALE CI
on:
  push:
    paths: ['SCALE/**', '.github/workflows/scale.yml']
  pull_request:
    paths: ['SCALE/**', '.github/workflows/scale.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - working-directory: SCALE
        run: sbt test
