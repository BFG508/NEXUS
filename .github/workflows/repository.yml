name: NEXUS Repository CI
on:
  push:
    paths:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '*/README.md'
      - '*/LICENSE'
      - '*/VERSION'
  pull_request:
    paths:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '*/README.md'
      - '*/LICENSE'
      - '*/VERSION'
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/repo_preflight.py
