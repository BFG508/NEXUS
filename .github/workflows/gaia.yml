name: GAIA CI
on:
  push:
    paths: ['GAIA/**', '.github/workflows/gaia.yml']
  pull_request:
    paths: ['GAIA/**', '.github/workflows/gaia.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Restore R environment
        working-directory: GAIA
        run: |
          Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          Rscript -e 'renv::restore(prompt=FALSE)'
      - name: Run ETL on repository fixture
        working-directory: GAIA
        run: Rscript scripts/process_data.R
      - name: Run tests
        working-directory: GAIA
        run: Rscript tests/testthat.R
