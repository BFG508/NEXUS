[project]
root = ".."
corpora = "config/corpora.toml"
concepts = "config/concepts.toml"
stopwords = "config/stopwords_en.txt"
valence_lexicon = "config/valence_en.toml"
results_dir = "results"

[provenance]
require_checksums = true
require_translator_for_translation = true

[preprocessing]
minimum_token_length = 1
remove_stopwords_for_dtm = true

[frequency]
normalization_scale = 1000000.0

[cooccurrence]
window = 3
distance_weighted = true

[embeddings]
window = 3
minimum_count = 1
maximum_vocabulary = 200
dimension = 4
minimum_anchors = 6

[alignment]
minimum_frequency = 1
maximum_frequency_ratio = 8.0
maximum_anchors = 100

[controls]
frequency_ratio = 3.0
maximum_controls = 30
minimum_controls = 5

[sentiment]
window = 5
negation_window = 2

[statistics]
frequency_bootstrap_replicates = 4
semantic_bootstrap_replicates = 4
semantic_bootstrap_maximum_vocabulary = 120
bootstrap_block_size = 50
minimum_valid_bootstrap_replicates = 2
minimum_valid_bootstrap_fraction = 0.5
confidence_level = 0.95
random_seed = 12345

[visualization]
maximum_labels = 12

[[comparisons]]
reference = "ancient"
target = "enlightenment"
